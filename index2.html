<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<title>桥筏 · 今天几点最好钓</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%230f766e'/%3E%3Ctext x='50' y='70' font-size='58' text-anchor='middle' fill='%23fff'%3E%E9%92%93%3C/text%3E%3C/svg%3E">
<style>
  :root{
    --bg:#faf9f6; --card:#fff; --ink:#20242a; --sub:#6b7280; --faint:#9ca3af;
    --line:#e8e6e0; --main:#0f766e; --main-soft:#e6f2f0;
    --good:#15803d; --warn:#b45309; --bad:#b91c1c;
  }
  html.dark{
    --bg:#14171a; --card:#1c2024; --ink:#e8eaec; --sub:#9aa3ab; --faint:#6b7280;
    --line:#2a2f34; --main:#2dd4bf; --main-soft:#12312e;
    --good:#4ade80; --warn:#fbbf24; --bad:#f87171;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html{scroll-behavior:smooth;}
  body{background:var(--bg);color:var(--ink);line-height:1.75;
    font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
    max-width:680px;margin:0 auto;padding:0 18px 40px;}
  .serif{font-family:Georgia,"Songti SC","SimSun",serif;}
  header{padding:26px 0 14px;display:flex;align-items:baseline;justify-content:space-between;gap:10px;}
  header h1{font-size:1.25rem;font-weight:700;letter-spacing:1px;}
  header h1 small{font-size:.8rem;color:var(--faint);font-weight:400;letter-spacing:0;margin-left:6px;}
  .head-actions{display:flex;gap:8px;align-items:center;}
  .icobtn{border:1px solid var(--line);background:var(--card);color:var(--sub);border-radius:999px;
    min-height:38px;padding:0 14px;font-size:.82rem;cursor:pointer;}
  .icobtn:active{background:var(--main-soft);}
  section{margin-top:22px;}
  h2{font-size:.86rem;font-weight:600;color:var(--sub);letter-spacing:2px;margin-bottom:10px;}
  /* ===== 今日结论 ===== */
  .verdict{margin-top:6px;border-top:1px solid var(--line);padding-top:18px;}
  .verdict-line{font-size:1.5rem;font-weight:700;letter-spacing:.5px;}
  .verdict-line.good{color:var(--good);} .verdict-line.warn{color:var(--warn);} .verdict-line.bad{color:var(--bad);}
  .verdict-sub{color:var(--sub);font-size:.9rem;margin-top:2px;}
  .score-row{display:flex;align-items:flex-end;gap:14px;margin-top:12px;}
  .score{font-size:4.6rem;line-height:1;font-weight:800;letter-spacing:-2px;color:var(--main);}
  .score small{font-size:1rem;font-weight:500;color:var(--faint);letter-spacing:0;}
  .score-meta{flex:1;min-width:0;}
  .score-meta .fish{border:1px solid var(--line);background:var(--card);border-radius:10px;
    padding:8px 12px;font-size:.95rem;color:var(--ink);min-height:44px;width:100%;max-width:220px;}
  .bar{height:7px;background:var(--line);border-radius:99px;margin-top:10px;overflow:hidden;}
  .bar i{display:block;height:100%;background:var(--main);border-radius:99px;transition:width .5s;}
  /* ===== 气压曲线 ===== */
  .pressure-box{border-top:1px solid var(--line);padding-top:16px;}
  .trend{font-size:.86rem;color:var(--sub);margin-top:4px;}
  .trend b{color:var(--ink);}
  .mini{font-size:.78rem;color:var(--faint);margin-top:2px;}
  .chart{width:100%;height:auto;display:block;margin-top:8px;}
  .chart .axis{stroke:var(--line);stroke-width:1;}
  .chart .line{fill:none;stroke:var(--main);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round;}
  .chart .area{fill:var(--main);opacity:.08;}
  .chart text{fill:var(--faint);font-size:10px;}
  /* ===== 窗口期 ===== */
  .wins{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
  .win{border:1px solid var(--line);border-radius:12px;padding:10px 6px;text-align:center;background:var(--card);}
  .win b{font-size:.86rem;display:block;}
  .win span{font-size:.72rem;color:var(--faint);}
  .win.hot{border-color:var(--main);background:var(--main-soft);}
  .win.hot b{color:var(--main);}
  /* ===== 数据行 ===== */
  .facts{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:.88rem;color:var(--sub);
    border-top:1px solid var(--line);padding-top:16px;}
  .facts b{color:var(--ink);font-weight:600;}
  /* ===== 建议 ===== */
  .advice{border-top:1px solid var(--line);padding-top:16px;}
  .advice p{font-size:.94rem;margin-bottom:6px;}
  .advice p b{color:var(--main);font-weight:600;}
  /* ===== 记录 ===== */
  .log-form{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  .log-form input,.log-form select{border:1px solid var(--line);background:var(--card);color:var(--ink);
    border-radius:10px;padding:10px 12px;font-size:15px;outline:none;min-height:44px;width:100%;}
  .log-form .full{grid-column:1/-1;}
  .btn{border:none;border-radius:10px;background:var(--main);color:#fff;font-weight:600;
    padding:12px;font-size:.95rem;cursor:pointer;width:100%;min-height:46px;}
  .btn:active{opacity:.85;}
  .log-stats{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 8px;font-size:.8rem;color:var(--sub);}
  .log-stats div{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px 12px;}
  .log-stats b{color:var(--main);font-size:1rem;}
  .log-item{border-bottom:1px dashed var(--line);padding:10px 0;font-size:.86rem;display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
  .log-item .del{margin-left:auto;border:none;background:none;color:var(--faint);font-size:.8rem;cursor:pointer;}
  .log-empty{color:var(--faint);font-size:.86rem;padding:8px 0;}
  /* ===== 工具 ===== */
  details.tools{border-top:1px solid var(--line);margin-top:24px;padding-top:14px;}
  details.tools summary{font-size:.9rem;color:var(--sub);cursor:pointer;list-style:none;}
  details.tools summary::-webkit-details-marker{display:none;}
  details.tools summary::after{content:" ＋展开";font-size:.78rem;color:var(--faint);}
  details.tools[open] summary::after{content:" －收起";}
  .tool-body{padding-top:14px;}
  .calc-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px;}
  .calc-row select,.calc-row input{border:1px solid var(--line);background:var(--card);color:var(--ink);
    border-radius:10px;padding:10px 12px;font-size:15px;outline:none;min-height:44px;}
  .calc-out{border-left:3px solid var(--main);background:var(--main-soft);border-radius:0 10px 10px 0;
    padding:12px 14px;font-size:.9rem;line-height:1.9;}
  .calc-out b{color:var(--main);}
  .recipe{margin-top:14px;font-size:.9rem;}
  .recipe h4{font-size:.92rem;margin:12px 0 4px;font-weight:600;}
  .recipe p{color:var(--sub);font-size:.88rem;}
  /* ===== 页脚 ===== */
  footer{margin-top:30px;border-top:1px solid var(--line);padding-top:16px;
    font-size:.78rem;color:var(--faint);line-height:1.9;}
  footer a{color:var(--sub);}
  .toast{position:fixed;left:50%;bottom:36px;transform:translateX(-50%) translateY(10px);
    background:rgba(24,28,32,.92);color:#fff;font-size:.86rem;padding:10px 20px;border-radius:999px;
    opacity:0;transition:.25s;pointer-events:none;z-index:99;max-width:86vw;text-align:center;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  @media(max-width:430px){
    .score{font-size:3.6rem;}
    .wins{grid-template-columns:repeat(2,1fr);}
    .log-form{grid-template-columns:1fr;}
  }
</style>
</head>
<body>
<header>
  <h1>桥筏<small id="cityName" class="serif">定位中…</small></h1>
  <div class="head-actions">
    <button class="icobtn" id="themeBtn">夜间</button>
    <button class="icobtn" id="locBtn">重定位</button>
    <button class="icobtn" id="setBtn">设置</button>
  </div>
</header>

<!-- 今日结论 -->
<section class="verdict">
  <div class="verdict-line" id="verdictLine">正在获取天气…</div>
  <div class="verdict-sub" id="verdictSub">—</div>
  <div class="score-row">
    <div class="score" id="scoreNum">--<small>分</small></div>
    <div class="score-meta">
      <select class="fish" id="fishSel"></select>
      <div class="bar"><i id="scoreBar" style="width:0%"></i></div>
    </div>
  </div>
</section>

<!-- 气压趋势 -->
<section class="pressure-box">
  <h2 class="serif">气压趋势 · 近24小时</h2>
  <div class="trend" id="trendText">—</div>
  <div class="mini" id="trendMini"></div>
  <svg class="chart" id="pChart" viewBox="0 0 600 150" preserveAspectRatio="none"></svg>
</section>

<!-- 窗口期 -->
<section>
  <h2 class="serif">今日窗口期</h2>
  <div class="wins" id="wins"></div>
  <div class="mini" id="winNote" style="margin-top:6px;"></div>
</section>

<!-- 关键数据 -->
<section class="facts" id="facts"></section>

<!-- 怎么钓 -->
<section class="advice">
  <h2 class="serif">今天怎么钓</h2>
  <div id="advice"></div>
</section>

<!-- 钓鱼记录 -->
<section class="advice" style="margin-top:26px;">
  <h2 class="serif">钓鱼记录</h2>
  <div class="log-form">
    <input id="logDate" type="date">
    <input id="logSpot" placeholder="钓位 / 桥墩，如：南门桥3号墩">
    <select id="logFish"></select>
    <input id="logCount" type="number" min="0" value="0" inputmode="numeric" placeholder="渔获条数">
    <input id="logNote" class="full" placeholder="备注（可选）：饵料 / 口情">
    <div class="full"><button class="btn" id="logAdd">记一笔（自动带上今天的天气）</button></div>
  </div>
  <div class="log-stats" id="logStats"></div>
  <div id="logList"></div>
</section>

<!-- 工具（次级） -->
<details class="tools">
  <summary class="serif">工具 · 钓组计算器与常用配方</summary>
  <div class="tool-body">
    <div class="calc-row">
      <select id="cFish"></select>
      <input id="cDepth" type="number" step="0.5" min="1" max="30" value="4.5" placeholder="水深(米)" inputmode="decimal">
      <select id="cFlow">
        <option value="0">静水</option>
        <option value="1">微走水</option>
        <option value="2" selected>中等走水</option>
        <option value="3">强走水</option>
        <option value="4">激流</option>
      </select>
      <select id="cWind">
        <option value="0">无风/2级</option>
        <option value="1" selected>3级</option>
        <option value="2">4级</option>
        <option value="3">5级</option>
      </select>
    </div>
    <button class="btn" id="cBtn">算一下钓组</button>
    <div class="calc-out" id="cOut" style="margin-top:10px;">选好参数后点上面按钮。</div>
    <div class="recipe" id="recipe"></div>
  </div>
</details>

<footer>
  <div>数据源：Open-Meteo · <span id="verLine">v1.0</span> · 出钓建议仅供参考</div>
  <div>旧版完整攻略：<a href="./index.html">点这里</a> · 雷雨大风请勿出钓</div>
</footer>

<!-- 设置弹窗 -->
<div id="setModal" hidden style="position:fixed;inset:0;background:rgba(12,16,18,.5);display:flex;align-items:center;justify-content:center;padding:20px;z-index:20;">
  <div style="background:var(--card);border-radius:16px;padding:22px;max-width:420px;width:100%;">
    <h2 class="serif" style="color:var(--ink);letter-spacing:0;font-size:1.05rem;margin-bottom:14px;">设置</h2>
    <label style="display:block;font-size:.88rem;color:var(--sub);margin-bottom:12px;">城市（手动输入更准）
      <input id="setCity" style="width:100%;margin-top:4px;border:1px solid var(--line);border-radius:10px;padding:10px;font-size:16px;background:var(--bg);color:var(--ink);outline:none;" placeholder="如：宜宾">
    </label>
    <label style="display:block;font-size:.88rem;color:var(--sub);margin-bottom:14px;">天气数据源
      <select id="setSrc" style="width:100%;margin-top:4px;border:1px solid var(--line);border-radius:10px;padding:10px;font-size:16px;background:var(--bg);color:var(--ink);outline:none;">
        <option value="openmeteo">Open-Meteo（免费免Key）</option>
        <option value="qweather">和风天气（需Key）</option>
      </select>
    </label>
    <label style="display:block;font-size:.88rem;color:var(--sub);margin-bottom:14px;">API Key（和风时填）
      <input id="setKey" style="width:100%;margin-top:4px;border:1px solid var(--line);border-radius:10px;padding:10px;font-size:16px;background:var(--bg);color:var(--ink);outline:none;" placeholder="选填">
    </label>
    <div style="display:flex;gap:10px;justify-content:flex-end;">
      <button class="icobtn" id="setClose">关闭</button>
      <button class="icobtn" id="setSave" style="background:var(--main);color:#fff;border-color:var(--main);">保存</button>
    </div>
  </div>
</div>

<script>
/* ============ 精简数据（10 种常用鱼） ============ */
const FISH = {
  crucian: { name:'鲫鱼', tmin:6, tmax:25, rig:'主线 1.0-1.2 / 子线 0.6-0.8 · 袖 3-4 号',
    formula:'野战蓝鲫 40% + 九一八 40% + 速攻2号 20%（冬季：蓝鲫 60% + 九一八 20% + 速攻 20%）',
    bait:'腥香（低温浓腥+红虫）', spot:'桥洞深水 / 桥墩向阳面 / 下游回水',
    chair:'冬春桥筏黄金季，钓桥墩向阳面与桥洞深水', note:'连续小幅点动 2-3 次再扬竿' },
  carp: { name:'鲤鱼', tmin:10, tmax:28, rig:'主线 1.5-2.0 / 子线 1.0-1.2 · 伊势尼 4-6 号',
    formula:'螺鲤（先泡水）1 + 九一八 1 + 速攻 0.5；守大物挂老坛玉米',
    bait:'薯香 / 螺腥 / 谷香', spot:'桥墩乱石建筑区 / 深浅交界',
    chair:'春秋靠边觅食，守钓为主', note:'钓钝放口，竿稍大弯再扬竿' },
  grass: { name:'草鱼', tmin:20, tmax:32, rig:'主线 1.5-2.0 / 子线 1.0-1.2 · 伊势尼 5-7 号',
    formula:'嫩玉米挂钩 + 发酵玉米打窝；或 巨无霸 1 + 超诱 1',
    bait:'青草 / 嫩玉米 / 发酵谷物', spot:'桥墩迎水面 / 桥底阴凉',
    chair:'高温季黄金，早晚贴底、正午半水', note:'抛投轻、少惊窝，中钩先溜翻' },
  bream: { name:'鳊鱼', tmin:15, tmax:28, rig:'主线 1.0-1.2 / 子线 0.6-0.8 · 海夕 4-5 号',
    formula:'九一八 1 + 藻元素 1 + 速攻 0.5，离底钓',
    bait:'本味 / 香 / 果酸，雾化诱鱼', spot:'下游回水缓流区 / 桥底阴凉',
    chair:'群居，离底截口多', note:'半水截口勤逗钓，进窝连竿' },
  culter: { name:'翘嘴', tmin:18, tmax:30, rig:'主线 1.2-1.5 / 子线 0.8-1.0 · 丸世 4-6 号',
    formula:'嫩玉米挂钩；或 九一八 + 虾粉 0.3 拉饵',
    bait:'玉米本味 / 虾腥', spot:'下游回水湾 / 桥墩回水',
    chair:'晨昏水面 0.5-1.5 米层', note:'缓降+点搜，下落时给口最多' },
  catfish: { name:'黄颡鱼', tmin:15, tmax:30, rig:'主线 1.2-1.5 / 子线 0.8-1.0 · 丸世 6-8 号',
    formula:'蚯蚓 / 鸡肝 / 红虫直挂，动物内脏拌泥打窝',
    bait:'腥重，越腥越好', spot:'桥墩乱石 / 桥底阴凉 / 老钓位',
    chair:'夏秋夜钓最佳', note:'黑漂后等 1-2 秒再打，摘钩防毒刺' },
  sheatfish: { name:'鲶鱼', tmin:16, tmax:30, rig:'主线 2.0-2.5 / 子线 1.2-1.5 · 伊势尼 6-8 号',
    formula:'大蚯蚓 / 泥鳅 / 鸡肝挂钩守底',
    bait:'动物内脏 / 活饵', spot:'桥墩深水石缝 / 桥洞深水',
    chair:'夏秋夜间浑水活跃', note:'夜钓守底，中钩打桩先溜翻' },
  tilapia: { name:'罗非鱼', tmin:24, tmax:34, rig:'主线 1.5-2.0 / 子线 1.0-1.2 · 新关东 0.5-1 号',
    formula:'大福寿 + 冷冻饵 1:1',
    bait:'腥香 / 肝味', spot:'桥底阴凉 / 下游回水',
    chair:'高温季最活跃（25℃+）', note:'饵要粘防小罗非闹，注意鳃盖硬刺' },
  whitebait: { name:'白条', tmin:15, tmax:30, rig:'主线 0.8-1.0 / 子线 0.4-0.6 · 袖 1-2 号',
    formula:'九一八 1 + 速攻 1 拉饵浮钓',
    bait:'腥香拉饵', spot:'桥墩迎水面 / 亮水区',
    chair:'夏秋高频抢食', note:'抓沉稳下顿，防假口' },
  mixed: { name:'综合鱼情', tmin:8, tmax:30, rig:'主线 1.2-1.5 / 子线 0.8-1.0 · 海夕 3-4 号',
    formula:'老三样：野战蓝鲫 40% + 九一八 40% + 速攻 20%',
    bait:'腥香通杀', spot:'下游回水缓流区 / 桥洞深水',
    chair:'不确定鱼情先通杀，再按实际调', note:'半小时没口果断换桥墩' }
};
const YB = { '翠屏':[28.7657,104.6324],'叙州':[28.7005,104.5178],'南溪':[28.8476,104.9682],'江安':[28.7168,105.0692],'长宁':[28.5983,104.9217],'高县':[28.4176,104.5231],'珙县':[28.3953,104.7128],'筠连':[28.1712,104.5156],'兴文':[28.3174,105.0653],'屏山':[28.6825,104.1578] };

/* ============ 小工具 ============ */
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(msg){
  let t = document.querySelector('.toast');
  if(!t){ t = document.createElement('div'); t.className = 'toast'; document.body.appendChild(t); }
  t.textContent = msg; t.classList.add('show');
  clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 2400);
}
async function getJSON(url, timeout){
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), timeout || 9000);
  try{
    const r = await fetch(url, { signal: ctrl.signal });
    if(!r.ok) throw new Error('HTTP ' + r.status);
    return await r.json();
  } finally { clearTimeout(timer); }
}
const store = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};
function moonPhase(d){
  const age = ((d.getTime() - Date.UTC(2000,0,6,18,14)) / 86400000) % 29.53058867;
  const a = (age + 29.53058867) % 29.53058867;
  if(a < 1.8) return { n:'新月', s:-2 };
  if(a < 8.8) return { n:'娥眉月', s:1 };
  if(a < 15.8) return { n:'上弦-盈凸', s:2 };
  if(a < 23.6) return { n:'满月-下弦', s:2 };
  return { n:'残月', s:0 };
}

/* ============ 状态 ============ */
let CFG = Object.assign({ src:'openmeteo', key:'' }, store.get('qf2_cfg', {}));
let CITY = store.get('qf2_city', null) || { name:'宜宾·叙州区', lat:28.7005, lon:104.5178 };
let FISHID = store.get('qf2_fish', 'crucian');
let WX = null;   // 当前天气快照 {temp, press, hum, wind, precip, hours:[{h,p}], sunrise, sunset, tmax, tmin, moon}

/* ============ 出钓指数 ============ */
function calcScore(){
  if(!WX) return null;
  const f = FISH[FISHID] || FISH.mixed;
  let s = 60;
  const t = WX.temp;
  if(t >= f.tmin && t <= f.tmax) s += 12;
  else if(t >= f.tmin - 5 && t <= f.tmax + 5) s += 4;
  else if(t < f.tmin - 10 || t > f.tmax + 10) s -= 20;
  else s -= 8;
  if(WX.wind <= 8) s += 6; else if(WX.wind <= 19) s += 3;
  else if(WX.wind <= 29) s -= 10; else s -= 25;
  if(WX.precip <= 10) s += 6; else if(WX.precip > 70) s -= 20; else if(WX.precip > 40) s -= 10;
  if(WX.press >= 1005 && WX.press <= 1020) s += 6;
  else if(WX.press < 1000 || WX.press > 1030) s -= 10;
  if(WX.hum >= 50 && WX.hum <= 80) s += 3; else if(WX.hum > 90) s -= 5;
  if(WX.tmax != null && WX.tmin != null){
    const diff = WX.tmax - WX.tmin;
    if(diff <= 6) s += 5; else if(diff > 12) s -= 12; else if(diff > 9) s -= 6;
  }
  /* 气压趋势（近 3 小时变化） */
  let pt = 0;
  if(WX.hours && WX.hours.length >= 4){
    const n = WX.hours.length;
    pt = WX.press - WX.hours[n-4].p;
    if(pt >= -1 && pt <= 1) s += 4;        // 稳定
    else if(pt > 1 && pt <= 4) s += 2;     // 缓升
    else if(pt < -4) s -= 8;               // 骤降
    else if(pt < -1) s -= 2;               // 缓降
  }
  /* 窗口期 */
  const hr = new Date().getHours() + new Date().getMinutes()/60;
  let win = '';
  if(WX.sunriseH != null && hr >= WX.sunriseH - 0.5 && hr <= WX.sunriseH + 2) { s += 6; win = 'morning'; }
  else if(WX.sunsetH != null && hr >= WX.sunsetH - 2 && hr <= WX.sunsetH + 0.5) { s += 6; win = 'evening'; }
  else if(hr >= 11 && hr <= 15) s -= 6;
  const moon = moonPhase(new Date());
  s += moon.s;
  s = Math.max(0, Math.min(100, Math.round(s)));
  return { s: s, pt: pt, win: win, moon: moon.n };
}

/* ============ 渲染 ============ */
function verdictOf(s){
  if(s >= 80) return { t:'今天值得去，别错过', c:'good', sub:'条件很合适，按计划出钓' };
  if(s >= 60) return { t:'可以去钓', c:'good', sub:'整体不错，注意下面几点' };
  if(s >= 40) return { t:'一般，看情况', c:'warn', sub:'有条件限制，挑好时段' };
  return { t:'今天不太建议', c:'bad', sub:'天气不利，去了也难开口' };
}
function renderToday(){
  const r = calcScore();
  if(!r){ $('verdictLine').textContent = '正在获取天气…'; return; }
  const v = verdictOf(r.s);
  const vLine = $('verdictLine');
  vLine.textContent = v.t;
  vLine.className = 'verdict-line ' + v.c;
  $('verdictSub').textContent = v.sub + ' · ' + (WX.cityName || CITY.name);
  $('scoreNum').innerHTML = r.s + '<small>分</small>';
  $('scoreBar').style.width = r.s + '%';
  /* 气压趋势 */
  const dir = r.pt > 1 ? '上升' : r.pt < -1 ? '下降' : '平稳';
  let pTxt = '气压' + dir;
  if(r.pt < -4) pTxt += '（骤降，鱼口可能变差）';
  else if(r.pt >= -1 && r.pt <= 1) pTxt += '（稳定，鱼口稳）';
  else if(r.pt > 1) pTxt += '（缓升，鱼活性好）';
  else pTxt += '（缓降，通常转好口）';
  $('trendText').innerHTML = '<b>' + WX.press + ' hPa</b> · ' + pTxt;
  $('trendMini').textContent = '近 24 小时气压走势（越低越闷，缓降转升是好信号）';
  drawChart();
  /* 窗口期 */
  const sr = WX.sunriseH, ss = WX.sunsetH;
  const fmt = h => h == null ? '--:--' : (String(Math.floor(h)).padStart(2,'0') + ':' + String(Math.round((h%1)*60)).padStart(2,'0'));
  const wins = [
    { k:'清晨', v: sr != null ? fmt(sr) + '-' + fmt(sr+2) : '--', hot: r.win === 'morning' },
    { k:'上午', v:'09:00-12:00', hot: false },
    { k:'傍晚', v: ss != null ? fmt(ss-2) + '-' + fmt(ss+0.5) : '--', hot: r.win === 'evening' },
    { k:'夜钓', v:'20:00-23:00', hot: false }
  ];
  $('wins').innerHTML = wins.map(w => '<div class="win' + (w.hot ? ' hot' : '') + '"><b>' + w.k + (w.hot ? ' ✓' : '') + '</b><span>' + w.v + '</span></div>').join('');
  $('winNote').textContent = '✓ 为当前时段' + (r.win ? '（正处窗口期，抓紧）' : '；窗口期为日出后 2h 与日落前 2h');
  /* 数据行 */
  const fam = WX.wind <= 8 ? '静/微风' : WX.wind <= 19 ? '轻风' : WX.wind <= 29 ? '和风' : '大风';
  $('facts').innerHTML =
    '<span>气温 <b>' + Math.round(WX.temp) + '°C</b></span>' +
    '<span>气压 <b>' + WX.press + ' hPa</b></span>' +
    '<span>风 <b>' + fam + '（' + Math.round(WX.wind) + 'km/h）</b></span>' +
    '<span>湿度 <b>' + Math.round(WX.hum) + '%</b></span>' +
    (WX.sunrise ? '<span>日出 <b>' + WX.sunrise + '</b> / 日落 <b>' + WX.sunset + '</b></span>' : '') +
    '<span>月相 <b>' + r.moon + '</b></span>' +
    '<span>昼夜温差 <b>' + (WX.tmax != null ? Math.round(WX.tmax - WX.tmin) + '°C' : '--') + '</b></span>';
  /* 一句话建议 */
  const f = FISH[FISHID] || FISH.mixed;
  let baitDir = f.bait;
  if(WX.temp < 10) baitDir = '浓腥 / 红虫活饵（加虾粉）';
  else if(WX.temp > 30) baitDir = '清淡本味 + 少量果酸（避杂鱼）';
  $('advice').innerHTML =
    '<p><b>钓什么：</b>' + f.name + '　最适 ' + f.tmin + '-' + f.tmax + '°C，今日 ' + Math.round(WX.temp) + '°C</p>' +
    '<p><b>用什么饵：</b>' + esc(baitDir) + '</p>' +
    '<p><b>去哪钓：</b>' + esc(f.spot) + '　（' + esc(f.chair) + '）</p>' +
    '<p><b>注意：</b>' + esc(f.note) + (WX.precip > 60 ? '；降水概率高，雨前口好、雷雨禁钓' : '') + '</p>';
}
function drawChart(){
  const svg = $('pChart');
  if(!WX || !WX.hours || WX.hours.length < 2){ svg.innerHTML = ''; return; }
  const hs = WX.hours;
  const vs = hs.map(x => x.p);
  let min = Math.min.apply(null, vs), max = Math.max.apply(null, vs);
  if(max - min < 2){ min -= 1; max += 1; }
  const pad = 6;
  const W = 600, H = 150;
  const X = i => pad + i * (W - pad*2) / (hs.length - 1);
  const Y = v => H - pad - (v - min) / (max - min) * (H - pad*2 - 16);
  const pts = hs.map((x, i) => X(i) + ',' + Y(x.p)).join(' ');
  svg.innerHTML =
    '<line class="axis" x1="0" y1="' + (H-pad) + '" x2="' + W + '" y2="' + (H-pad) + '"/>' +
    '<polygon class="area" points="' + pts + ' ' + X(hs.length-1) + ',' + (H-pad) + ' ' + X(0) + ',' + (H-pad) + '"/>' +
    '<polyline class="line" points="' + pts + '"/>' +
    '<text x="' + pad + '" y="12">' + Math.round(max) + ' hPa</text>' +
    '<text x="' + pad + '" y="' + (H-pad-4) + '">' + Math.round(min) + ' hPa</text>' +
    '<text x="' + (W-70) + '" y="' + (H-pad-4) + '">现在</text>';
}

/* ============ 天气 ============ */
async function loadWeather(){
  const { lat, lon } = CITY;
  try{
    if(CFG.src === 'qweather' && CFG.key){
      const j = await getJSON('https://devapi.qweather.com/v7/weather/now?location=' + lon.toFixed(2) + ',' + lat.toFixed(2) + '&key=' + CFG.key);
      if(j.code !== '200') throw new Error('和风错误 ' + j.code);
      WX = { temp: parseFloat(j.now.temp), press: parseFloat(j.now.pressure), hum: parseFloat(j.now.humidity),
        wind: parseFloat(j.now.windSpeed), precip: 20, hours: null, tmax: null, tmin: null,
        sunrise: null, sunset: null, sunriseH: null, sunsetH: null, cityName: CITY.name };
      renderToday();
      return;
    }
    const url = 'https://api.open-meteo.com/v1/forecast?latitude=' + lat + '&longitude=' + lon +
      '&current=temperature_2m,relative_humidity_2m,surface_pressure,wind_speed_10m' +
      '&hourly=surface_pressure' +
      '&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max,sunrise,sunset' +
      '&timezone=auto&forecast_days=2';
    const d = await getJSON(url, 9000);
    const now = new Date();
    const hNow = now.getHours();
    /* 近 24 小时气压（取今天 0 点到现在的最后 24 个点） */
    let hrs = [];
    if(d.hourly && d.hourly.time){
      const idxNow = d.hourly.time.findIndex(t => new Date(t).getHours() === hNow);
      const end = idxNow >= 0 ? idxNow : Math.min(23, d.hourly.time.length - 1);
      const start = Math.max(0, end - 23);
      for(let i = start; i <= end; i++) hrs.push({ h: i, p: d.hourly.surface_pressure[i] });
    }
    const sr = d.daily.sunrise && d.daily.sunrise[0] ? d.daily.sunrise[0] : null;
    const ss = d.daily.sunset && d.daily.sunset[0] ? d.daily.sunset[0] : null;
    const toH = v => { if(!v) return null; const t = new Date(v); return isNaN(t) ? null : t.getHours() + t.getMinutes()/60; };
    const fmt = v => { if(!v) return null; const t = new Date(v); return isNaN(t) ? null : String(t.getHours()).padStart(2,'0') + ':' + String(t.getMinutes()).padStart(2,'0'); };
    WX = {
      temp: d.current.temperature_2m,
      press: Math.round(d.current.surface_pressure),
      hum: d.current.relative_humidity_2m,
      wind: d.current.wind_speed_10m,
      precip: d.daily.precipitation_probability_max ? (d.daily.precipitation_probability_max[0] || 0) : 20,
      hours: hrs,
      tmax: d.daily.temperature_2m_max ? d.daily.temperature_2m_max[0] : null,
      tmin: d.daily.temperature_2m_min ? d.daily.temperature_2m_min[0] : null,
      sunrise: fmt(sr), sunset: fmt(ss), sunriseH: toH(sr), sunsetH: toH(ss),
      cityName: CITY.name
    };
    renderToday();
  }catch(e){
    $('verdictLine').textContent = '天气获取失败';
    $('verdictLine').className = 'verdict-line bad';
    $('verdictSub').textContent = '检查网络，或点右上「设置」手动输入城市';
    toast('天气获取失败：' + (e && e.message ? e.message : '网络错误'));
  }
}

/* ============ 定位 ============ */
async function locate(){
  const applyIp = async () => {
    try{
      const j = await getJSON('https://ipapi.co/json/', 6000);
      if(j && j.latitude){
        CITY = { name: (j.city || '当前位置') + (j.region ? '·' + j.region : ''), lat: parseFloat(j.latitude), lon: parseFloat(j.longitude) };
        store.set('qf2_city', CITY); $('cityName').textContent = CITY.name; await loadWeather(); return true;
      }
    }catch(e){}
    return false;
  };
  const onErr = async () => { if(!(await applyIp())) toast('定位失败，请手动输入城市'); };
  if(!window.isSecureContext || !navigator.geolocation){ onErr(); return; }
  navigator.geolocation.getCurrentPosition(async pos => {
    CITY = { name:'当前位置', lat: pos.coords.latitude, lon: pos.coords.longitude };
    try{
      const g = await getJSON('https://geocoding-api.open-meteo.com/v1/search?reverse=true&latitude=' + CITY.lat + '&longitude=' + CITY.lon + '&count=1&language=zh', 6000);
      if(g && g.results && g.results[0]){
        const r = g.results[0];
        CITY.name = r.name + (r.admin1 && r.admin1 !== r.name ? '·' + r.admin1 : '');
      }
    }catch(e){}
    store.set('qf2_city', CITY); $('cityName').textContent = CITY.name; loadWeather();
  }, onErr, { timeout: 8000 });
}

/* ============ 记录 ============ */
function logs(){ return store.get('qf2_logs', []); }
function saveLogs(l){ store.set('qf2_logs', l); }
function renderLogs(){
  const list = logs();
  const box = $('logList'), st = $('logStats');
  if(!list.length){ st.innerHTML = ''; box.innerHTML = '<div class="log-empty">还没有记录。钓完记一笔，慢慢就有「哪个桥墩最出鱼」的答案了。</div>'; return; }
  let catchAll = 0, open = 0;
  const bySpot = {};
  list.forEach(r => {
    catchAll += r.count || 0;
    if((r.count || 0) > 0) open++;
    if(r.spot) bySpot[r.spot] = (bySpot[r.spot] || 0) + (r.count || 0);
  });
  const top = Object.keys(bySpot).sort((a,b) => bySpot[b] - bySpot[a]).slice(0, 3);
  st.innerHTML =
    '<div><b>' + list.length + '</b> 次出钓</div>' +
    '<div><b>' + catchAll + '</b> 条渔获</div>' +
    '<div>开口率 <b>' + Math.round(open / list.length * 100) + '%</b></div>' +
    (top.length ? '<div>最出鱼：<b>' + top.map(k => k + '(' + bySpot[k] + ')').join('、') + '</b></div>' : '');
  box.innerHTML = list.slice().reverse().map((r, i) => {
    const idx = list.length - 1 - i;
    return '<div class="log-item">' +
      '<b>' + esc(r.date) + '</b> ' + esc(r.spot || '—') +
      ' · ' + esc(r.fishName || '') +
      ' · <b>' + (r.count || 0) + ' 条</b>' +
      (r.weather ? ' <span style="color:var(--faint)">' + esc(r.weather) + '</span>' : '') +
      (r.note ? ' <span style="color:var(--faint)">' + esc(r.note) + '</span>' : '') +
      '<button class="del" data-del="' + idx + '">删除</button></div>';
  }).join('');
  box.querySelectorAll('[data-del]').forEach(el => {
    el.addEventListener('click', () => {
      const l = logs(); l.splice(parseInt(el.dataset.del, 10), 1); saveLogs(l); renderLogs();
    });
  });
}

/* ============ 工具 ============ */
function calcRig(){
  const f = FISH[$('cFish').value] || FISH.mixed;
  const depth = parseFloat($('cDepth').value) || 4.5;
  const flow = parseInt($('cFlow').value, 10);
  const wind = parseInt($('cWind').value, 10);
  const depthBase = depth < 3 ? 3 : depth < 6 ? 5 : depth < 10 ? 7 : 10;
  const lead = Math.max(3, Math.min(20, depthBase + flow + wind + (FISHID === 'crucian' ? 0 : 1)));
  $('cOut').innerHTML =
    '<b>' + f.name + '</b> · 水深 ' + depth + ' 米<br>' +
    '建议铅重：<b>' + lead + ' g</b>' + (lead > 6 ? '（轻口可减 2g）' : '') + '<br>' +
    '线组：<b>' + f.rig + '</b><br>' +
    '配方：' + esc(f.formula);
}
function renderRecipe(){
  $('recipe').innerHTML = '<h4 class="serif">常用配方速查</h4>' +
    Object.keys(FISH).map(k => {
      const f = FISH[k];
      return '<p><b style="color:var(--ink)">' + f.name + '</b>：' + esc(f.formula) + '</p>';
    }).join('');
}

/* ============ 初始化 ============ */
(function init(){
  /* 主题 */
  const theme = store.get('qf2_theme', matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  document.documentElement.classList.toggle('dark', theme === 'dark');
  $('themeBtn').textContent = theme === 'dark' ? '日间' : '夜间';
  $('themeBtn').addEventListener('click', () => {
    const d = !document.documentElement.classList.contains('dark');
    document.documentElement.classList.toggle('dark', d);
    store.set('qf2_theme', d ? 'dark' : 'light');
    $('themeBtn').textContent = d ? '日间' : '夜间';
  });
  /* 鱼种下拉 */
  const opts = Object.keys(FISH).map(k => '<option value="' + k + '">' + FISH[k].name + '</option>').join('');
  $('fishSel').innerHTML = opts; $('fishSel').value = FISHID;
  $('cFish').innerHTML = opts; $('cFish').value = FISHID;
  $('logFish').innerHTML = opts;
  $('fishSel').addEventListener('change', e => {
    FISHID = e.target.value; store.set('qf2_fish', FISHID);
    $('cFish').value = FISHID;
    renderToday();
  });
  $('cFish').addEventListener('change', e => { FISHID = e.target.value; store.set('qf2_fish', FISHID); $('fishSel').value = FISHID; renderToday(); });
  /* 定位 / 设置 */
  $('locBtn').addEventListener('click', locate);
  $('setBtn').addEventListener('click', () => {
    $('setCity').value = CITY.name.indexOf('当前位置') >= 0 ? '' : CITY.name.replace('·', ' ');
    $('setSrc').value = CFG.src; $('setKey').value = CFG.key || '';
    $('setModal').hidden = false;
  });
  $('setClose').addEventListener('click', () => { $('setModal').hidden = true; });
  $('setModal').addEventListener('click', e => { if(e.target.id === 'setModal') e.target.hidden = true; });
  $('setSave').addEventListener('click', async () => {
    CFG = { src: $('setSrc').value, key: $('setKey').value.trim() };
    store.set('qf2_cfg', CFG);
    const cityIn = $('setCity').value.trim();
    $('setModal').hidden = true;
    if(cityIn){
      try{
        const g = await getJSON('https://geocoding-api.open-meteo.com/v1/search?name=' + encodeURIComponent(cityIn) + '&count=1&language=zh&format=json', 8000);
        if(g && g.results && g.results[0]){
          const r = g.results[0];
          CITY = { name: r.name + (r.admin1 ? '·' + r.admin1 : ''), lat: r.latitude, lon: r.longitude };
          store.set('qf2_city', CITY);
        } else { toast('没找到这个城市'); return; }
      }catch(e){ toast('城市查询失败'); return; }
    }
    $('cityName').textContent = CITY.name;
    toast('已保存，正在刷新天气');
    loadWeather();
  });
  /* 记录 */
  const todayStr = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); };
  $('logDate').value = todayStr();
  $('logAdd').addEventListener('click', () => {
    const cnt = parseInt($('logCount').value, 10) || 0;
    const rec = {
      date: $('logDate').value || todayStr(),
      spot: $('logSpot').value.trim(),
      fish: $('logFish').value,
      fishName: FISH[$('logFish').value] ? FISH[$('logFish').value].name : '',
      count: cnt,
      note: $('logNote').value.trim(),
      weather: WX ? (Math.round(WX.temp) + '°C ' + WX.press + 'hPa ' + (WX.wind <= 19 ? '微风' : '有风')) : ''
    };
    const l = logs(); l.push(rec); saveLogs(l); renderLogs();
    $('logSpot').value = ''; $('logNote').value = ''; $('logCount').value = 0;
    toast('已记录' + (rec.weather ? '（' + rec.weather + '）' : ''));
  });
  /* 工具 */
  $('cBtn').addEventListener('click', calcRig);
  renderRecipe(); calcRig();
  renderLogs();
  /* 天气 */
  $('cityName').textContent = CITY.name;
  loadWeather();
})();
</script>
